# Configuração central da infraestrutura Quorum.
# Todos os scripts leem este arquivo. Para outro ambiente, copie e aponte QUORUM_CONF.

HOSTNAME_SERVIDOR="quorum-srv01"
DOMINIO="quorum.local"
FUSO_HORARIO="America/Sao_Paulo"

# auto = detecta WSL ou VM com netplan
REDE_MODO="auto"
REDE_INTERFACE=""
IP_SERVICO="10.77.0.10/24"
IP_ESTATICO=""
GATEWAY=""
DNS_SERVIDORES="1.1.1.1 8.8.8.8"

FIREWALL="sim"
PORTAS_LIBERADAS="22 80"

USUARIO_APP="quorum"
GRUPO_OPERADORES="quorum-ops"

APP_REPO_URL="https://github.com/lorransantosdev/quorum-api.git"
APP_BRANCH="main"
APP_ORIGEM_LOCAL=""
APP_DIR="/opt/quorum/app"
APP_VENV="/opt/quorum/venv"
APP_PORTA="8000"
APP_HOST_PUBLICO="api.quorum.local"

DB_NOME="quorum"
DB_USUARIO="quorum"

CONF_DIR="/etc/quorum"
LOG_DIR="/var/log/quorum"

MONITOR_INTERVALO="20"
CPU_ALERTA="80"
CPU_CRITICO="95"
MEM_ALERTA="80"
MEM_CRITICO="95"
DISCO_ALERTA="80"
DISCO_CRITICO="90"
SERVICOS_MONITORADOS="quorum-api postgresql nginx"
FALHAS_SAUDE_ANTES_DE_REINICIAR="3"
